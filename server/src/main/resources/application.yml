server:
  port: 8080

spring:
  application:
    name: linkduel
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # serverTimezone/allowPublicKeyRetrieval:MySQL 8 caching_sha2_password 非 TLS 连接必需
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:linkduel}?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:linkduel}
    password: ${DB_PASSWORD:linkduel123}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
  flyway:
    locations: classpath:db/migration
    enabled: true
  jackson:
    time-zone: Asia/Shanghai

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  # 开发密钥。生产环境务必通过环境变量 JWT_SECRET 覆盖(HS256 要求 >= 32 字节)
  secret: ${JWT_SECRET:linkduel-dev-only-secret-key-0123456789abcdef}
  expire-hours: 2

game:
  # 对局时长(秒)——限时积分制
  duration-seconds: 120
  # 断线宽限期(秒):超过则判在线方胜 / 双离线取消
  forfeit-grace-seconds: 90
  # 对局状态在 Redis 中的保留时间(分钟),覆盖断线重连窗口
  room-ttl-minutes: 30
  # 匹配后等待双方进入对局的超时(秒)
  join-timeout-seconds: 60
  # 洗牌重试上限
  max-reshuffle-tries: 10
  # 棋盘边长(8x8)
  board-size: 8
